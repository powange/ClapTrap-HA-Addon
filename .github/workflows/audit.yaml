# Failles connues dans les dependances Python de l'image (requirements.lock,
# que Dependabot ne lit pas). Chaque semaine et a la demande ; un echec
# signale une version a remonter (scripts/lock_requirements.py).
name: Audit des dépendances

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (requirements.lock)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --require-hashes -r data/requirements.lock
