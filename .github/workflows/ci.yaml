# Tests, images et publication de l'add-on.
#
# La version a publier est dans VERSION ; `version` de config.yaml est la
# version publiee, celle que voit Home Assistant. A chaque push sur main :
#   1. tests (pytest, interface) ;
#   2. si VERSION differe de config.yaml : images amd64/aarch64 puis manifeste
#      multi-architecture sur ghcr.io/powange/claptrap ;
#   3. seulement ensuite, config.yaml passe a la nouvelle version (commit du
#      workflow). Une version n'est donc jamais annoncee avant son image, ni
#      publiee si un test ou un build echoue.
# Sur une pull request : tests et construction des images amd64 et aarch64
# sans publication (sautee si la PR ne touche que les tests ou la doc).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: claptrap

permissions:
  contents: read

# Une publication a la fois, dans l'ordre des pushes : deux runs paralleles
# pouvaient ecrire config.yaml dans le desordre (6.54 puis 6.53).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Tests Python
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            data/requirements-dev.txt
            data/constraints.txt
      - run: pip install -r data/requirements-dev.txt
      - run: python scripts/check_lock.py
      - run: python -m pytest -q data/tests

  ui:
    name: Tests de l'interface
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: pip install -r data/tests/ui/requirements.txt
      - run: npm ci --prefix data/tests/ui
      - run: python data/tests/ui/render_page.py data/tests/ui/page.html
      - run: node data/tests/ui/ui_test.js data/tests/ui/page.html

  build-pr:
    name: Construction de l'image ${{ matrix.arch }} (pull request)
    if: github.event_name == 'pull_request'
    needs: [python, ui]
    timeout-minutes: 60
    # Les deux architectures : une casse propre a aarch64 (roue mediapipe,
    # controles de l'image, autotest YAMNet) n'apparaissait qu'apres la
    # fusion, quand amd64 avait deja publie ses etiquettes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fichiers qui touchent l'image
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Tests, doc et Dependabot seuls : rien a construire ; deux builds
        # epargnes (les blueprints sont dans l'image depuis la 6.95).
        run: |
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only \
              | grep -qvE '^(data/tests/|\.github/dependabot\.yml$|[^/]*\.md$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "Seulement des tests ou de la documentation : image non construite"
          fi
      - name: Semaine en cours
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.image == 'true'
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-claptrap
          image-tags: pr
          # Meme semaine que la publication : paquets Debian a jour, comme
          # l'image qui sera publiee.
          build-args: APT_REFRESH=${{ steps.week.outputs.week }}
          push: "false"
          load: "true"
          version: pr
      # Profil AppArmor strict : l'image demarre sous le profil (fuseau
      # horaire different de celui de l'image : tzdata reconfigure, comme
      # chez un utilisateur) et aucun acces n'est refuse. Une image de base
      # ou des paquets Debian qui changent ce que les scripts de demarrage
      # touchent cassaient sinon le demarrage chez tout le monde.
      - name: Démarrage sous le profil AppArmor strict
        if: steps.changes.outputs.image == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-claptrap:pr
        run: |
          set -u
          command -v apparmor_parser > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q apparmor; }
          if grep -q 'flags=(.*complain' apparmor.txt; then echo "Profil en mode complain : rien a verifier"; exit 0; fi
          # Nom donne comme le Supervisor (<depot>_claptrap) : les regles qui
          # visent le profil par motif (signaux) sont verifiees aussi.
          sed 's/^profile claptrap /profile ci_claptrap /' apparmor.txt > /tmp/apparmor-ci.txt
          sudo apparmor_parser -r -W /tmp/apparmor-ci.txt
          since=$(date -u '+%Y-%m-%d %H:%M:%S')
          # Faux Supervisor : l'add-on demarre completement (bashio, run.sh,
          # Gunicorn, MQTT), pas seulement les scripts de l'image de base.
          docker network create claptrap-ci > /dev/null
          docker run -d --name supervisor --network claptrap-ci --network-alias supervisor \
            -v "$PWD/.github/ci/fake_supervisor.py:/f.py:ro" python:3.13-alpine python -u /f.py > /dev/null
          for i in $(seq 1 30); do
            docker exec supervisor python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1/ping')" 2> /dev/null && break
            sleep 1
          done
          # /data : volume persistant de l'add-on, comme sous le Supervisor (sans
          # lui, les reglages iraient dans /usr/src/app, refuse a juste titre).
          docker run -d --name claptrap-aa --network claptrap-ci --security-opt apparmor=ci_claptrap \
            -v "$(mktemp -d):/data" -e TZ=Europe/Paris -e SUPERVISOR_TOKEN=ci "$IMAGE"
          sleep 45
          docker logs claptrap-aa 2>&1 | tail -30
          # Sous le profil aussi : interface, YAMNet (mediapipe) et ffmpeg.
          code=$(docker exec claptrap-aa curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:16045/ || true)
          echo "Interface : HTTP $code"
          docker exec -w /usr/src/app claptrap-aa venv/bin/python selftest_yamnet.py 2>&1 | tail -2
          docker exec claptrap-aa ffmpeg -hide_banner -version | head -1
          running=$(docker inspect -f '{{.State.Running}}' claptrap-aa)
          docker rm -f claptrap-aa supervisor > /dev/null
          docker network rm claptrap-ci > /dev/null
          if [ "$running" != "true" ] || [ "$code" != "403" ]; then
            echo "::error::ClapTrap ne tourne pas sous le profil AppArmor (conteneur en marche : $running, interface : HTTP $code ; 403 attendu hors ingress)"
            exit 1
          fi
          denied=$(sudo journalctl -k --since "$since" --no-pager | grep 'apparmor="DENIED"' | grep 'ci_claptrap' || true)
          if [ -n "$denied" ]; then
            echo "::error::Accès refusés par le profil AppArmor :"
            echo "$denied"
            exit 1
          fi
          echo "Aucun accès refusé par le profil AppArmor"

  init:
    name: Version à publier
    # Publication depuis main seulement (un lancement manuel depuis une autre
    # branche publiait une version absente de main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read   # lecture des images deja publiees (garde-fou)
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      week: ${{ steps.version.outputs.week }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Comparer VERSION et config.yaml
        id: version
        run: |
          next="$(tr -d '[:space:]' < VERSION)"
          current="$(yq '.version' config.yaml)"
          echo "VERSION=$next, config.yaml=$current"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$next" =~ $semver ]]; then
            echo "::error file=VERSION::VERSION invalide ($next) : attendu X.Y.Z"; exit 1
          fi
          if ! [[ "$current" =~ $semver ]]; then
            echo "::error file=config.yaml::version de config.yaml invalide ($current)"; exit 1
          fi
          if [ "$next" = "$current" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$next" "$current" | sort -V | tail -1)" != "$next" ]; then
            # Une faute de frappe (6.53.1 apres 6.54.0) remplacerait latest par
            # un code plus ancien.
            echo "::error file=VERSION::VERSION ($next) inferieure a la version publiee ($current)"; exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Matrice
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
      - name: Refuser une version publiée à moitié
        # skip-existing saute une architecture deja poussee : apres un echec
        # partiel suivi d'un nouveau commit, la version melangerait deux
        # contenus (amd64 ancien, aarch64 nouveau). Une version presente pour
        # une partie des architectures n'est reprise que depuis le meme commit
        # (relance d'un run interrompu) ; sinon, nouvelle VERSION.
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN" > /dev/null
          found=(); missing=(); foreign=()
          while read -r arch image; do
            ref="$image:$VERSION"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              found+=("$arch")
              rev=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
                | jq -r '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"] // empty] | first // ""')
              [ "$rev" = "$SHA" ] || foreign+=("$arch (${rev:-révision inconnue})")
            elif [[ "$out" == *"$ref: not found"* || "$out" == *"manifest unknown"* || "$out" == *"MANIFEST_UNKNOWN"* ]]; then
              missing+=("$arch")
            else
              echo "::error::Impossible de vérifier $ref : $out"; exit 1
            fi
          done < <(jq -r '.include[] | "\(.arch) \(.image)"' <<< "$MATRIX")
          echo "Déjà publiées : ${found[*]:-aucune} ; à construire : ${missing[*]:-aucune}"
          if [ ${#found[@]} -gt 0 ] && [ ${#missing[@]} -gt 0 ] && [ ${#foreign[@]} -gt 0 ]; then
            echo "::error file=VERSION::$VERSION n'existe que pour ${foreign[*]}, construite depuis un autre commit : passer à une nouvelle VERSION"; exit 1
          fi

  build:
    name: Image ${{ matrix.arch }}
    needs: init
    if: needs.init.outputs.publish == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Paquets Debian rafraichis au moins chaque semaine (couche apt).
          build-args: APT_REFRESH=${{ needs.init.outputs.week }}
          push: "true"
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Manifeste multi-architecture
    needs: [init, build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          skip-existing: ${{ needs.init.outputs.version }}

  release:
    name: Publier la version
    needs: [init, manifest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main   # derniere version de main (un commit a pu arriver depuis)
      - name: config.yaml passe à la version publiée
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          v="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            current="$(yq '.version' config.yaml)"
            # Jamais de retour en arriere (run plus ancien termine apres un plus recent).
            if [ "$(printf '%s\n%s\n' "$v" "$current" | sort -V | tail -1)" != "$v" ] || [ "$v" = "$current" ]; then
              echo "config.yaml deja en $current : rien a publier"; exit 0
            fi
            sed -i "s/^version: .*/version: \"$v\"/" config.yaml
            git diff --quiet || git commit -qam "Release $v"
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --hard origin/main
          done
          exit 1
