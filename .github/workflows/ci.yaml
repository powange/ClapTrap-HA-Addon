# Tests, images et publication de l'add-on.
#
# La version a publier est dans VERSION ; `version` de config.yaml est la
# version publiee, celle que voit Home Assistant. A chaque push sur main :
#   1. tests (pytest, interface) ;
#   2. si VERSION differe de config.yaml : images amd64/aarch64 puis manifeste
#      multi-architecture sur ghcr.io/powange/claptrap ;
#   3. seulement ensuite, config.yaml passe a la nouvelle version (commit du
#      workflow). Une version n'est donc jamais annoncee avant son image, ni
#      publiee si un test ou un build echoue.
# Sur une pull request : tests et construction de l'image amd64 sans publication.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: claptrap

permissions:
  contents: read

# Une publication a la fois, dans l'ordre des pushes : deux runs paralleles
# pouvaient ecrire config.yaml dans le desordre (6.54 puis 6.53).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Tests Python
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            data/requirements-dev.txt
            data/constraints.txt
      - run: pip install -r data/requirements-dev.txt
      - run: python scripts/check_lock.py
      - run: python -m pytest -q data/tests

  ui:
    name: Tests de l'interface
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: pip install -r data/tests/ui/requirements.txt
      - run: npm ci --prefix data/tests/ui
      - run: python data/tests/ui/render_page.py data/tests/ui/page.html
      - run: node data/tests/ui/ui_test.js data/tests/ui/page.html

  build-pr:
    name: Construction de l'image (pull request)
    if: github.event_name == 'pull_request'
    needs: [python, ui]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Semaine en cours
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: amd64
          image: ghcr.io/${{ github.repository_owner }}/amd64-claptrap
          image-tags: pr
          # Meme semaine que la publication : paquets Debian a jour, comme
          # l'image qui sera publiee.
          build-args: APT_REFRESH=${{ steps.week.outputs.week }}
          push: "false"
          version: pr

  init:
    name: Version à publier
    # Publication depuis main seulement (un lancement manuel depuis une autre
    # branche publiait une version absente de main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read   # lecture des images deja publiees (garde-fou)
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      week: ${{ steps.version.outputs.week }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Comparer VERSION et config.yaml
        id: version
        run: |
          next="$(tr -d '[:space:]' < VERSION)"
          current="$(yq '.version' config.yaml)"
          echo "VERSION=$next, config.yaml=$current"
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$next" =~ $semver ]]; then
            echo "::error file=VERSION::VERSION invalide ($next) : attendu X.Y.Z"; exit 1
          fi
          if ! [[ "$current" =~ $semver ]]; then
            echo "::error file=config.yaml::version de config.yaml invalide ($current)"; exit 1
          fi
          if [ "$next" = "$current" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$next" "$current" | sort -V | tail -1)" != "$next" ]; then
            # Une faute de frappe (6.53.1 apres 6.54.0) remplacerait latest par
            # un code plus ancien.
            echo "::error file=VERSION::VERSION ($next) inferieure a la version publiee ($current)"; exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Matrice
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
      - name: Refuser une version publiée à moitié
        # skip-existing saute une architecture deja poussee : apres un echec
        # partiel suivi d'un nouveau commit, la version melangerait deux
        # contenus (amd64 ancien, aarch64 nouveau). Une version presente pour
        # une partie des architectures n'est reprise que depuis le meme commit
        # (relance d'un run interrompu) ; sinon, nouvelle VERSION.
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN" > /dev/null
          found=(); missing=(); foreign=()
          while read -r arch image; do
            ref="$image:$VERSION"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              found+=("$arch")
              rev=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
                | jq -r '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"] // empty] | first // ""')
              [ "$rev" = "$SHA" ] || foreign+=("$arch (${rev:-révision inconnue})")
            elif [[ "$out" == *"$ref: not found"* || "$out" == *"manifest unknown"* || "$out" == *"MANIFEST_UNKNOWN"* ]]; then
              missing+=("$arch")
            else
              echo "::error::Impossible de vérifier $ref : $out"; exit 1
            fi
          done < <(jq -r '.include[] | "\(.arch) \(.image)"' <<< "$MATRIX")
          echo "Déjà publiées : ${found[*]:-aucune} ; à construire : ${missing[*]:-aucune}"
          if [ ${#found[@]} -gt 0 ] && [ ${#missing[@]} -gt 0 ] && [ ${#foreign[@]} -gt 0 ]; then
            echo "::error file=VERSION::$VERSION n'existe que pour ${foreign[*]}, construite depuis un autre commit : passer à une nouvelle VERSION"; exit 1
          fi

  build:
    name: Image ${{ matrix.arch }}
    needs: init
    if: needs.init.outputs.publish == 'true'
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Paquets Debian rafraichis au moins chaque semaine (couche apt).
          build-args: APT_REFRESH=${{ needs.init.outputs.week }}
          push: "true"
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Manifeste multi-architecture
    needs: [init, build]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          skip-existing: ${{ needs.init.outputs.version }}

  release:
    name: Publier la version
    needs: [init, manifest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main   # derniere version de main (un commit a pu arriver depuis)
      - name: config.yaml passe à la version publiée
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          v="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main
            current="$(yq '.version' config.yaml)"
            # Jamais de retour en arriere (run plus ancien termine apres un plus recent).
            if [ "$(printf '%s\n%s\n' "$v" "$current" | sort -V | tail -1)" != "$v" ] || [ "$v" = "$current" ]; then
              echo "config.yaml deja en $current : rien a publier"; exit 0
            fi
            sed -i "s/^version: .*/version: \"$v\"/" config.yaml
            git diff --quiet || git commit -qam "Release $v"
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --hard origin/main
          done
          exit 1
