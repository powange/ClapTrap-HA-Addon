<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClapTrap</title>
    <link rel="stylesheet" href="{{ ingress_path }}/css/{{ cache_bust }}/style.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>

<body>
    <header>
        <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="ClapTrap" id="logo">
        <h1>ClapTrap</h1>
    </header>

    <div class="notifications">
        <div id="error" class="notification error" style="display: none;"></div>
        <div id="success" class="notification success" style="display: none;"></div>
    </div>

    <main class="dashboard">
        <!-- Control Bar -->
        <section class="control-bar">
            <div id="detection_display" class="detection-circle">
                <span id="waiting-emoji">&#x1F442;</span>
                <span class="clap-emoji" data-source="microphone" style="display: none;">&#x1F44F;</span>
            </div>
            <div class="control-panel">
                <button id="startButton" class="btn btn-primary">Demarrer</button>
                <button id="stopButton" class="btn btn-danger" style="display: none;">Arreter</button>
            </div>
            <div class="control-settings">
                <div class="control-setting">
                    <label for="delay">Multi-clap :</label>
                    <input type="number" id="delay" name="delay" min="0.5" max="5" step="0.1" value="{{ settings['global']['delay'] }}">
                    <span class="unit">sec</span>
                </div>
                <div class="control-setting">
                    <label>Auto-start :</label>
                    <label class="switch">
                        <input type="checkbox" id="auto-start"
                               {% if settings.microphone.auto_start %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="control-setting">
                    <label>Debug :</label>
                    <label class="switch">
                        <input type="checkbox" id="debug-toggle"
                               {% if settings['global'].get('debug', false) %}checked{% endif %}>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="control-setting">
                    <button id="exportConfigBtn" class="btn btn-secondary" title="Exporter la config">&#x1F4E5;</button>
                    <label class="btn btn-secondary" title="Importer une config" style="cursor:pointer;margin:0;">
                        &#x1F4E4;
                        <input type="file" id="importConfigInput" accept=".json" style="display:none;">
                    </label>
                    <button id="saveConfigButton" class="btn btn-primary">
                        <span>&#x1F4BE;</span> Sauvegarder
                    </button>
                </div>
            </div>
            <div id="active-sources" class="active-sources"></div>
        </section>

        <!-- Sources Tabs -->
        <section class="sources-section">
            <div class="tabs-header" style="position:relative;">
                <div style="position:relative;display:inline-block;">
                    <button id="addSourceBtn" class="tab-btn" type="button">+ Ajouter</button>
                    <div class="add-source-menu" id="addSourceMenu" style="display:none;top:100%;left:0;">
                        <button type="button" data-type="mic">&#x1F3A4; Microphone</button>
                        <button type="button" data-type="rtsp">&#x1F4F9; RTSP</button>
                        <button type="button" data-type="vban">&#x1F3B5; VBAN</button>
                    </div>
                </div>
                <div id="source-tabs" style="display:contents;"></div>
            </div>
            <div id="source-tab-content"></div>
        </section>

        <!-- History -->
        <section class="config-card">
            <h3>Historique</h3>
            <div id="detected_labels" class="labels-container"></div>
        </section>
    </main>

    <footer>
        {% if debug %}
        <a href="#" onclick="runTests(); return false;">Tests</a> |
        {% endif %}
        <a href="https://korben.info">Korben</a> & <a href="https://lesfrerespoulain.fr/">Les Freres Poulain</a>
    </footer>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <script type="text/javascript">
        window.settings = {{ settings|tojson }};
        window.settings.debug = {{ 'true' if debug else 'false' }};
        window.basePath = '{{ ingress_path }}';
        window.devices = {{ devices|tojson }};
    </script>

    <script type="module" src="{{ ingress_path }}/js/{{ cache_bust }}/script.js"></script>

    <!-- Fallback inline -->
    <script type="text/javascript">
    (function() {
        var testing = false;

        // ===== Tab System =====
        function buildTabs() {
            var tabs = document.getElementById('source-tabs');
            var content = document.getElementById('source-tab-content');
            if (!tabs || !content) return;
            tabs.innerHTML = '';
            content.innerHTML = '';

            var sources = [];
            var settings = window.settings || {};

            // Micro
            if (settings.microphone) {
                sources.push({type: 'mic', id: 'mic', name: settings.microphone.audio_source || 'Microphone', data: settings.microphone});
            }

            // RTSP
            (settings.rtsp_sources || []).forEach(function(s) {
                sources.push({type: 'rtsp', id: 'rtsp_' + s.id, name: s.name || 'RTSP', data: s});
            });

            // VBAN
            (settings.saved_vban_sources || []).forEach(function(s, i) {
                sources.push({type: 'vban', id: 'vban_' + i, name: s.name || 'VBAN', data: s});
            });

            sources.forEach(function(src, idx) {
                // Tab button
                var tab = document.createElement('button');
                tab.className = 'tab-btn' + (idx === 0 ? ' active' : '');
                tab.textContent = src.name;
                tab.setAttribute('data-tab', src.id);
                tab.addEventListener('click', function() { switchTab(src.id); });
                tabs.appendChild(tab);

                // Tab content
                var panel = document.createElement('div');
                panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
                panel.id = 'panel-' + src.id;
                panel.innerHTML = buildTabContent(src);
                content.appendChild(panel);
            });

            // Re-bind events inside tabs
            bindTabEvents();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
            var btn = document.querySelector('.tab-btn[data-tab="' + tabId + '"]');
            var panel = document.getElementById('panel-' + tabId);
            if (btn) btn.classList.add('active');
            if (panel) panel.classList.add('active');
        }

        function buildTabContent(src) {
            if (src.type === 'mic') return buildMicTab(src);
            if (src.type === 'rtsp') return buildRtspTab(src);
            if (src.type === 'vban') return buildVbanTab(src);
            return '';
        }

        function buildMicTab(src) {
            var d = src.data;
            var devices = window.devices || [];
            var deviceOptions = '';
            devices.forEach(function(dev) {
                var val = dev.index + '|' + dev.name + '|' + (dev.pulse_name || '');
                var sel = (dev.name === d.audio_source) ? ' selected' : '';
                deviceOptions += '<option value="' + escAttr(val) + '"' + sel + '>' + esc(dev.name) + '</option>';
            });
            var enabled = d.enabled ? ' checked' : '';
            var autoVol = d.auto_volume ? ' checked' : '';
            var volDisabled = d.auto_volume ? ' disabled' : '';
            var volume = d.volume !== undefined ? d.volume : 100;
            var threshold = d.threshold !== undefined ? d.threshold : 0.5;
            var webhookUrl = d.webhook_url || '';

            return '<div class="source-header">' +
                '<div style="display:flex;align-items:center;gap:0.5rem;">' +
                    '<label class="switch" title="Activer/Desactiver"><input type="checkbox" id="webhook-mic-enabled"' + enabled + '><span class="slider round"></span></label>' +
                    '<strong>&#x1F3A4; Microphone</strong>' +
                '</div>' +
                '<button type="button" class="btn btn-danger btn-sm delete-source-btn" data-type="mic" data-id="mic">&#x274C; Supprimer</button>' +
            '</div>' +
            '<div class="source-config">' +
                '<div class="source-selector">' +
                    '<label for="micro_source">Source :</label>' +
                    '<select name="micro_source" id="micro_source">' + deviceOptions + '</select>' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label for="threshold">Precision : <span id="threshold-value">' + threshold + '</span></label>' +
                    '<input type="range" id="threshold" min="0" max="1" step="0.1" value="' + threshold + '">' +
                '</div>' +
                '<div class="mic-volume-section">' +
                    '<div class="mic-volume-header">' +
                        '<label for="mic-volume">Volume : <span id="mic-volume-value">' + volume + '%</span></label>' +
                        '<div class="auto-volume-toggle">' +
                            '<label class="switch" title="Volume automatique"><input type="checkbox" id="mic-auto-volume"' + autoVol + '><span class="slider round"></span></label>' +
                            '<span class="auto-volume-label">Auto</span>' +
                        '</div>' +
                    '</div>' +
                    '<input type="range" id="mic-volume" min="0" max="150" step="5" value="' + volume + '" class="mic-volume-slider"' + volDisabled + '>' +
                '</div>' +
                '<div class="webhook-input-group">' +
                    '<label class="form-label">Webhook</label>' +
                    '<div class="webhook-input-with-test">' +
                        '<input type="url" id="webhook-mic-url" value="' + escAttr(webhookUrl) + '" placeholder="https://votre-serveur.com/webhook" aria-label="URL du webhook">' +
                        '<button type="button" class="test-webhook" data-source="mic">&#x1F514; Tester</button>' +
                    '</div>' +
                '</div>' +
                '<div class="mic-test-section">' +
                    '<button type="button" id="mic-test-btn" class="btn-mic-test">&#x1F3A4; Tester le micro</button>' +
                    '<div id="mic-test-vu" class="vu-meter" style="display: none;">' +
                        '<div class="vu-meter-track"><div id="mic-test-bar" class="vu-meter-bar"></div></div>' +
                        '<span id="mic-test-db" class="vu-meter-label">-60 dB</span>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function buildRtspTab(src) {
            var d = src.data;
            var enabled = d.enabled ? ' checked' : '';
            var volume = d.gain !== undefined ? d.gain : 10;
            var threshold = d.threshold !== undefined ? d.threshold : 0.5;
            var webhookUrl = d.webhook_url || '';
            var name = d.name || 'RTSP';
            var url = d.url || '';
            var streamId = d.id || '';

            return '<div class="source-header">' +
                '<div style="display:flex;align-items:center;gap:0.5rem;">' +
                    '<label class="switch" title="Activer/Desactiver"><input type="checkbox" class="rtsp-enabled-toggle" data-id="' + escAttr(streamId) + '"' + enabled + '><span class="slider round"></span></label>' +
                    '<input type="text" class="rtsp-name-input" data-id="' + escAttr(streamId) + '" value="' + escAttr(name) + '">' +
                    '<span class="rtsp-status-dot status-connecting" data-url="' + escAttr(url) + '" title="Connexion..."></span>' +
                '</div>' +
                '<button type="button" class="btn btn-danger btn-sm delete-source-btn" data-type="rtsp" data-id="' + escAttr(streamId) + '">&#x274C; Supprimer</button>' +
            '</div>' +
            '<div class="source-config">' +
                '<div class="setting-item">' +
                    '<label>URL RTSP</label>' +
                    '<input type="url" class="rtsp-url-input" data-id="' + escAttr(streamId) + '" value="' + escAttr(url) + '" placeholder="rtsp://camera:554/stream">' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label>Precision : <span class="rtsp-threshold-value">' + threshold + '</span></label>' +
                    '<input type="range" class="rtsp-threshold" data-id="' + escAttr(streamId) + '" min="0" max="1" step="0.1" value="' + threshold + '">' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label>Volume : <span class="rtsp-volume-value">' + volume + 'x</span></label>' +
                    '<input type="range" class="rtsp-volume" data-id="' + escAttr(streamId) + '" min="1" max="50" step="1" value="' + volume + '">' +
                '</div>' +
                '<div class="webhook-input-group">' +
                    '<label class="form-label">Webhook</label>' +
                    '<div class="webhook-input-with-test">' +
                        '<input type="url" class="rtsp-webhook-url" data-id="' + escAttr(streamId) + '" value="' + escAttr(webhookUrl) + '" placeholder="https://votre-serveur.com/webhook">' +
                        '<button type="button" class="test-webhook" data-source="rtsp_' + escAttr(streamId) + '">&#x1F514; Tester</button>' +
                    '</div>' +
                '</div>' +
                '<div class="mic-test-section">' +
                    '<button type="button" class="btn-mic-test rtsp-test-btn" data-id="' + escAttr(streamId) + '">&#x1F4F9; Tester le flux</button>' +
                    '<div class="vu-meter rtsp-test-vu" style="display: none;">' +
                        '<div class="vu-meter-track"><div class="vu-meter-bar rtsp-test-bar"></div></div>' +
                        '<span class="vu-meter-label rtsp-test-db">-60 dB</span>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function buildVbanTab(src) {
            var d = src.data;
            var enabled = d.enabled !== undefined ? d.enabled : true;
            var enabledAttr = enabled ? ' checked' : '';
            var threshold = d.threshold !== undefined ? d.threshold : 0.5;
            var webhookUrl = d.webhook_url || '';
            var name = d.name || 'VBAN';
            var ip = d.ip || '';
            var port = d.port || '';

            return '<div class="source-header">' +
                '<div style="display:flex;align-items:center;gap:0.5rem;">' +
                    '<label class="switch" title="Activer/Desactiver"><input type="checkbox" class="vban-enabled-toggle" data-index="' + src.id.replace('vban_', '') + '"' + enabledAttr + '><span class="slider round"></span></label>' +
                    '<strong>&#x1F3B5; ' + esc(name) + '</strong>' +
                '</div>' +
                '<button type="button" class="btn btn-danger btn-sm delete-source-btn" data-type="vban" data-id="' + src.id.replace('vban_', '') + '">&#x274C; Supprimer</button>' +
            '</div>' +
            '<div class="source-config">' +
                '<div class="setting-item">' +
                    '<label>Nom</label>' +
                    '<span>' + esc(name) + '</span>' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label>IP</label>' +
                    '<span>' + esc(ip) + '</span>' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label>Port</label>' +
                    '<span>' + esc(String(port)) + '</span>' +
                '</div>' +
                '<div class="setting-item">' +
                    '<label>Precision : <span class="vban-threshold-value">' + threshold + '</span></label>' +
                    '<input type="range" class="vban-threshold" data-index="' + src.id.replace('vban_', '') + '" min="0" max="1" step="0.1" value="' + threshold + '">' +
                '</div>' +
                '<div class="webhook-input-group">' +
                    '<label class="form-label">Webhook</label>' +
                    '<div class="webhook-input-with-test">' +
                        '<input type="url" class="vban-webhook-url webhook-url" data-index="' + src.id.replace('vban_', '') + '" value="' + escAttr(webhookUrl) + '" placeholder="https://votre-serveur.com/webhook">' +
                        '<button type="button" class="test-webhook" data-source="vban_' + src.id.replace('vban_', '') + '">&#x1F514; Tester</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        // HTML escaping helpers
        function esc(s) {
            if (!s) return '';
            var d = document.createElement('div');
            d.appendChild(document.createTextNode(s));
            return d.innerHTML;
        }
        function escAttr(s) {
            return esc(s).replace(/"/g, '&quot;');
        }

        // ===== Add Source Menu =====
        var addBtn = document.getElementById('addSourceBtn');
        var addMenu = document.getElementById('addSourceMenu');
        if (addBtn && addMenu) {
            addBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                addMenu.style.display = addMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', function(e) {
                if (!addMenu.contains(e.target) && e.target !== addBtn) {
                    addMenu.style.display = 'none';
                }
            });
            // Délégation sur les boutons du menu
            var menuBtns = addMenu.querySelectorAll('button[data-type]');
            menuBtns.forEach(function(mbtn) {
                mbtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var type = mbtn.getAttribute('data-type');
                    addMenu.style.display = 'none';
                    addSource(type);
                });
            });
        }

        function addSource(type) {
            var basePath = window.basePath || '';
            var settings = window.settings || {};
            if (type === 'mic') {
                if (settings.microphone) {
                    alert('Un microphone est deja configure.');
                    return;
                }
                settings.microphone = {enabled: true, audio_source: '', webhook_url: '', volume: 100, auto_volume: false, threshold: 0.5, auto_start: false};
                window.settings = settings;
                buildTabs();
                switchTab('mic');
            } else if (type === 'rtsp') {
                fetch(basePath + '/api/rtsp/stream', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name: 'Nouveau RTSP', url: '', enabled: false, gain: 10, threshold: 0.5})
                }).then(function(r) { return r.json(); })
                  .then(function(data) {
                      if (data.success && data.stream) {
                          if (!window.settings.rtsp_sources) window.settings.rtsp_sources = [];
                          window.settings.rtsp_sources.push(data.stream);
                          buildTabs();
                          switchTab('rtsp_' + data.stream.id);
                      }
                  })
                  .catch(function(err) { console.error('Add RTSP error:', err); });
            } else if (type === 'vban') {
                // Récupérer les sources VBAN détectées sur le réseau
                fetch(basePath + '/refresh_vban_sources')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var sources = data.sources || [];
                        if (sources.length === 0) {
                            alert('Aucune source VBAN detectee sur le reseau.');
                            return;
                        }
                        // Proposer la première source trouvée
                        var names = sources.map(function(s) { return s.name + ' (' + s.ip + ')'; });
                        var choice = prompt('Sources VBAN detectees :\n' + names.join('\n') + '\n\nEntrez le numero (1-' + sources.length + ') :');
                        if (!choice) return;
                        var idx = parseInt(choice) - 1;
                        if (idx < 0 || idx >= sources.length) return;
                        var src = sources[idx];
                        // Sauvegarder la source VBAN
                        fetch(basePath + '/api/vban/save', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({source: src})
                        }).then(function(r) { return r.json(); })
                          .then(function(result) {
                              if (result.success) {
                                  if (!window.settings.saved_vban_sources) window.settings.saved_vban_sources = [];
                                  window.settings.saved_vban_sources.push(src);
                                  buildTabs();
                                  switchTab('vban_' + (window.settings.saved_vban_sources.length - 1));
                              }
                          });
                    })
                    .catch(function(err) { console.error('VBAN discovery error:', err); });
            }
        }

        // ===== Bind events inside tab panels =====
        var _rtspTesting = {};  // {streamId: true/false}

        function bindTabEvents() {
            var basePath = window.basePath || '';

            // Mic threshold slider
            var thresholdSlider = document.getElementById('threshold');
            var thresholdValue = document.getElementById('threshold-value');
            if (thresholdSlider && thresholdValue) {
                thresholdSlider.addEventListener('input', function() {
                    thresholdValue.textContent = thresholdSlider.value;
                });
                thresholdSlider.addEventListener('change', function() {
                    fetch(basePath + '/api/microphone/threshold', {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({threshold: parseFloat(thresholdSlider.value)})
                    });
                });
            }

            // Mic enabled toggle
            var micEnabled = document.getElementById('webhook-mic-enabled');
            if (micEnabled) {
                micEnabled.addEventListener('change', function() {
                    fetch(basePath + '/api/microphone/enabled', {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: micEnabled.checked})
                    });
                });
            }

            // RTSP sliders + inputs
            document.querySelectorAll('.rtsp-threshold').forEach(function(slider) {
                var sid = slider.getAttribute('data-id');
                slider.addEventListener('input', function() {
                    var label = slider.parentElement.querySelector('.rtsp-threshold-value');
                    if (label) label.textContent = slider.value;
                });
                slider.addEventListener('change', function() {
                    fetch(basePath + '/api/rtsp/stream/' + sid, {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({threshold: parseFloat(slider.value)})
                    });
                });
            });

            document.querySelectorAll('.rtsp-volume').forEach(function(slider) {
                var sid = slider.getAttribute('data-id');
                slider.addEventListener('input', function() {
                    var label = slider.parentElement.querySelector('.rtsp-volume-value');
                    if (label) label.textContent = slider.value + 'x';
                });
                slider.addEventListener('change', function() {
                    fetch(basePath + '/api/rtsp/stream/' + sid, {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({gain: parseInt(slider.value)})
                    });
                });
            });

            document.querySelectorAll('.rtsp-url-input').forEach(function(input) {
                var sid = input.getAttribute('data-id');
                var timeout;
                input.addEventListener('input', function() {
                    clearTimeout(timeout);
                    timeout = setTimeout(function() {
                        fetch(basePath + '/api/rtsp/stream/' + sid, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({url: input.value.trim()})
                        });
                    }, 500);
                });
            });

            document.querySelectorAll('.rtsp-name-input').forEach(function(input) {
                var sid = input.getAttribute('data-id');
                var timeout;
                input.addEventListener('input', function() {
                    clearTimeout(timeout);
                    timeout = setTimeout(function() {
                        fetch(basePath + '/api/rtsp/stream/' + sid, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name: input.value.trim()})
                        });
                    }, 500);
                });
            });

            document.querySelectorAll('.rtsp-enabled-toggle').forEach(function(toggle) {
                var sid = toggle.getAttribute('data-id');
                toggle.addEventListener('change', function() {
                    fetch(basePath + '/api/rtsp/stream/' + sid, {
                        method: 'PUT', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({enabled: toggle.checked})
                    });
                });
            });

            document.querySelectorAll('.rtsp-webhook-url').forEach(function(input) {
                var sid = input.getAttribute('data-id');
                var timeout;
                input.addEventListener('input', function() {
                    clearTimeout(timeout);
                    timeout = setTimeout(function() {
                        fetch(basePath + '/api/rtsp/stream/' + sid, {
                            method: 'PUT', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({webhook_url: input.value.trim()})
                        });
                    }, 500);
                });
            });

            // RTSP test buttons
            document.querySelectorAll('.rtsp-test-btn').forEach(function(btn) {
                var sid = btn.getAttribute('data-id');
                btn.addEventListener('click', function() {
                    var panel = btn.closest('.tab-panel');
                    var urlInput = panel ? panel.querySelector('.rtsp-url-input') : null;
                    var volSlider = panel ? panel.querySelector('.rtsp-volume') : null;
                    var url = urlInput ? urlInput.value : '';
                    var gain = volSlider ? parseInt(volSlider.value) : 10;
                    var vu = panel ? panel.querySelector('.rtsp-test-vu') : null;

                    if (_rtspTesting[sid]) {
                        fetch(basePath + '/api/rtsp/test/stop', {method: 'POST'});
                        _rtspTesting[sid] = false;
                        btn.textContent = '📹 Tester le flux';
                        btn.classList.remove('active');
                        if (vu) vu.style.display = 'none';
                    } else {
                        fetch(basePath + '/api/rtsp/test/start', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({url: url, gain: gain})
                        }).then(function(r) { return r.json(); }).then(function(data) {
                            if (data.success) {
                                _rtspTesting[sid] = true;
                                btn.textContent = '⏹ Arreter le test';
                                btn.classList.add('active');
                                if (vu) vu.style.display = 'flex';
                            }
                        }).catch(function(err) { console.error('RTSP test error:', err); });
                    }
                });
            });

            // VBAN threshold sliders
            document.querySelectorAll('.vban-threshold').forEach(function(slider) {
                slider.addEventListener('input', function() {
                    var label = slider.parentElement.querySelector('.vban-threshold-value');
                    if (label) label.textContent = slider.value;
                });
            });

            // Delete source buttons
            document.querySelectorAll('.delete-source-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var type = btn.getAttribute('data-type');
                    var id = btn.getAttribute('data-id');
                    if (!confirm('Supprimer cette source ?')) return;
                    deleteSource(type, id);
                });
            });
        }

        function deleteSource(type, id) {
            var basePath = window.basePath || '';
            var settings = window.settings || {};
            if (type === 'mic') {
                settings.microphone = null;
                window.settings = settings;
                buildTabs();
            } else if (type === 'rtsp') {
                fetch(basePath + '/api/rtsp/stream/' + id, {method: 'DELETE'})
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            settings.rtsp_sources = (settings.rtsp_sources || []).filter(function(s) { return s.id !== id; });
                            window.settings = settings;
                            buildTabs();
                        }
                    })
                    .catch(function(err) { console.error('Delete RTSP error:', err); });
            } else if (type === 'vban') {
                var idx = parseInt(id);
                var vbanSrc = settings.saved_vban_sources && settings.saved_vban_sources[idx];
                if (vbanSrc) {
                    fetch(basePath + '/api/vban/remove', {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({source: vbanSrc})
                    }).then(function(r) { return r.json(); })
                      .then(function(data) {
                          settings.saved_vban_sources.splice(idx, 1);
                          window.settings = settings;
                          buildTabs();
                      })
                      .catch(function(err) { console.error('Delete VBAN error:', err); });
                }
            }
        }

        // ===== Mic test (inline fallback) =====
        document.addEventListener('click', function(e) {
            var btn = e.target.closest && e.target.closest('#mic-test-btn');
            if (!btn) return;

            var basePath = window.basePath || '';
            if (testing) {
                fetch(basePath + '/api/mic/test/stop', {method: 'POST'});
                testing = false;
                btn.innerHTML = '&#x1F3A4; Tester le micro';
                btn.classList.remove('active');
                var vu = document.getElementById('mic-test-vu');
                if (vu) vu.style.display = 'none';
            } else {
                // Envoyer le device actuellement selectionne dans le dropdown
                var micSelect = document.getElementById('micro_source');
                var body = {};
                if (micSelect && micSelect.value) {
                    var parts = micSelect.value.split('|');
                    body = {pulse_name: parts[2] || '', audio_source: parts[1] || ''};
                }
                fetch(basePath + '/api/mic/test/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            testing = true;
                            btn.innerHTML = '&#x23F9; Arreter le test';
                            btn.classList.add('active');
                            var vu = document.getElementById('mic-test-vu');
                            if (vu) vu.style.display = 'flex';
                        }
                    })
                    .catch(function(err) { console.error('Mic test error:', err); });
            }
        });

        // Helper : lire le pulse_name du device selectionne
        function getSelectedPulseName() {
            var sel = document.getElementById('micro_source');
            if (sel && sel.value) {
                return sel.value.split('|')[2] || '';
            }
            return '';
        }

        // Volume slider
        document.addEventListener('input', function(e) {
            if (e.target.id === 'mic-volume') {
                var volLabel = document.getElementById('mic-volume-value');
                if (volLabel) volLabel.textContent = e.target.value + '%';
            }
        });
        document.addEventListener('change', function(e) {
            if (e.target.id === 'mic-volume') {
                var volume = parseInt(e.target.value);
                var basePath = window.basePath || '';
                fetch(basePath + '/api/microphone/volume', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({volume: volume, pulse_name: getSelectedPulseName()})
                }).then(function(r) { return r.json(); })
                  .then(function(data) {
                      if (data.success) console.log('Volume mis a jour:', volume + '%');
                  })
                  .catch(function(err) { console.error('Erreur volume:', err); });
            }
        });

        // Auto-volume toggle
        document.addEventListener('change', function(e) {
            if (e.target.id === 'mic-auto-volume') {
                var enabled = e.target.checked;
                var basePath = window.basePath || '';
                fetch(basePath + '/api/microphone/auto-volume', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: enabled, pulse_name: getSelectedPulseName()})
                }).then(function(r) { return r.json(); })
                  .then(function(data) {
                      if (data.success) {
                          var slider = document.getElementById('mic-volume');
                          if (slider) slider.disabled = enabled;
                          console.log('Auto-volume:', enabled ? 'active' : 'desactive');
                      } else {
                          e.target.checked = !enabled;
                          console.error('Auto-volume erreur:', data.error);
                      }
                  })
                  .catch(function(err) {
                      e.target.checked = !enabled;
                      console.error('Auto-volume erreur:', err);
                  });
            }
        });

        // Export/Import config
        var exportBtn = document.getElementById('exportConfigBtn');
        if (exportBtn) {
            exportBtn.addEventListener('click', function() {
                var basePath = window.basePath || '';
                window.location.href = basePath + '/api/settings/export';
            });
        }
        var importInput = document.getElementById('importConfigInput');
        if (importInput) {
            importInput.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var formData = new FormData();
                formData.append('file', file);
                var basePath = window.basePath || '';
                fetch(basePath + '/api/settings/import', {method: 'POST', body: formData})
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            alert('Configuration importee. La page va se recharger.');
                            window.location.reload();
                        } else {
                            alert('Erreur: ' + (data.error || 'Import echoue'));
                        }
                    })
                    .catch(function(err) { alert('Erreur import: ' + err); });
                importInput.value = '';
            });
        }

        // Debug toggle
        document.addEventListener('change', function(e) {
            if (e.target.id === 'debug-toggle') {
                var basePath = window.basePath || '';
                fetch(basePath + '/api/settings/debug', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: e.target.checked})
                });
            }
        });

        // Auto-start toggle
        document.addEventListener('change', function(e) {
            if (e.target.id === 'auto-start') {
                var basePath = window.basePath || '';
                fetch(basePath + '/api/microphone/auto-start', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: e.target.checked})
                });
            }
        });

        // Socket.io mic levels
        var checkSocket = setInterval(function() {
            if (typeof io !== 'undefined') {
                clearInterval(checkSocket);
                var basePath = window.basePath || '';
                var sock = io({path: basePath + '/socket.io'});
                sock.on('mic_level', function(data) {
                    var bar = document.getElementById('mic-test-bar');
                    var label = document.getElementById('mic-test-db');
                    if (!bar || !label || data.error) return;
                    var pct = Math.max(0, Math.min(100, ((data.db + 60) / 60) * 100));
                    bar.style.width = pct + '%';
                    label.textContent = data.db + ' dB';
                });
                // Auto-volume : mettre a jour le slider quand l'AGC ajuste
                sock.on('auto_volume_update', function(data) {
                    var slider = document.getElementById('mic-volume');
                    var label = document.getElementById('mic-volume-value');
                    if (slider && label && data.volume !== undefined) {
                        slider.value = data.volume;
                        label.textContent = data.volume + '%';
                    }
                });

                // RTSP test VU-metre
                sock.on('rtsp_level', function(data) {
                    var bars = document.querySelectorAll('.rtsp-test-bar');
                    var labels = document.querySelectorAll('.rtsp-test-db');
                    bars.forEach(function(bar) {
                        if (!data.error) {
                            var pct = Math.max(0, Math.min(100, ((data.db + 60) / 60) * 100));
                            bar.style.width = pct + '%';
                        }
                    });
                    labels.forEach(function(label) {
                        if (data.error) {
                            label.textContent = 'Erreur';
                        } else {
                            label.textContent = data.db + ' dB';
                        }
                    });
                });

                // RTSP status indicators
                sock.on('rtsp_status', function(data) {
                    var dots = document.querySelectorAll('.rtsp-status-dot');
                    dots.forEach(function(dot) {
                        if (dot.getAttribute('data-url') === data.url) {
                            dot.className = 'rtsp-status-dot status-' + data.status;
                            var titles = {
                                'connecting': 'Connexion...',
                                'connected': 'Connecte',
                                'reconnecting': 'Reconnexion...',
                                'error': 'Erreur: ' + (data.error || '')
                            };
                            dot.title = titles[data.status] || data.status;
                        }
                    });
                });

                // Ecouter les changements d'etat de detection (auto-start, stop)
                sock.on('detection_status', function(data) {
                    var startBtn = document.getElementById('startButton');
                    var stopBtn = document.getElementById('stopButton');
                    if (!startBtn || !stopBtn) return;
                    if (data.status === 'running') {
                        startBtn.style.display = 'none';
                        stopBtn.style.display = 'block';
                        updateSourceDisplay(data.source || null);
                    } else {
                        startBtn.style.display = 'block';
                        stopBtn.style.display = 'none';
                        updateSourceDisplay(null);
                    }
                });
            }
        }, 200);

        // Afficher/masquer les sources actives (en liste)
        function updateSourceDisplay(source) {
            var el = document.getElementById('active-sources');
            if (!el) return;
            if (source) {
                var sources = source.split(' + ');
                el.innerHTML = sources.map(function(s) {
                    return '<span class="source-badge">' + s.trim() + '</span>';
                }).join('');
            } else {
                el.innerHTML = '';
            }
        }

        // Verifier l'etat de detection au chargement
        (function() {
            var basePath = window.basePath || '';
            fetch(basePath + '/status')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.running) {
                        var startBtn = document.getElementById('startButton');
                        var stopBtn = document.getElementById('stopButton');
                        if (startBtn) startBtn.style.display = 'none';
                        if (stopBtn) stopBtn.style.display = 'block';
                        updateSourceDisplay(data.source);
                    }
                })
                .catch(function() {});
        })();

        // Build tabs on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', buildTabs);
        } else {
            buildTabs();
        }
    })();
    </script>

    <template id="vbanDetectedSourceTemplate">
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong class="source-name"></strong>
                <small class="text-muted d-block">IP: <span class="source-ip"></span> - Port: <span class="source-port"></span></small>
            </div>
            <button class="btn btn-sm btn-success add-vban-btn">Ajouter</button>
        </div>
    </template>

    <template id="vbanSavedSourceTemplate">
        <div class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong class="source-name"></strong>
                    <small class="text-muted d-block">IP: <span class="source-ip"></span> - Port: <span class="source-port"></span></small>
                </div>
                <div class="source-controls">
                    <label class="switch" title="Activer/Desactiver">
                        <input type="checkbox" class="source-enabled">
                        <span class="slider round"></span>
                    </label>
                    <button type="button" class="btn btn-light btn-sm delete-vban-btn">
                        <span class="icon" style="color: var(--color-danger);">&#x274C;</span>
                    </button>
                </div>
            </div>
            <div class="webhook-input-group mt-2">
                <label class="form-label">Webhook</label>
                <div class="webhook-input-with-test">
                    <input type="url" class="webhook-input webhook-url"
                           placeholder="https://votre-serveur.com/webhook">
                    <button type="button" class="test-webhook">
                        &#x1F514; Tester
                    </button>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
