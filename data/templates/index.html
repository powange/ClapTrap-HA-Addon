<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClapTrap</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>

<body>
    <header>
        <img src="{{ url_for('static', filename='img/logo.webp') }}" alt="ClapTrap" id="logo">
        <h1>ClapTrap</h1>
    </header>

    <div class="notifications">
        <div id="error" class="notification error" style="display: none;"></div>
        <div id="success" class="notification success" style="display: none;"></div>
    </div>

    <main class="dashboard">
        <!-- Detection -->
        <section class="visualization-panel">
            <div id="detection_display">
                <span id="waiting-emoji">&#x1F442;</span>
                <span class="clap-emoji" data-source="microphone" style="display: none;">&#x1F44F;</span>
            </div>
            <div class="control-panel">
                <button id="startButton" class="btn btn-primary">Demarrer</button>
                <button id="stopButton" class="btn btn-danger" style="display: none;">Arreter</button>
            </div>
            <div id="detected_labels" class="labels-container"></div>
        </section>

        <!-- Configuration -->
        <section class="config-panel">
            <div class="config-header">
                <h2>Configuration</h2>
                <button id="saveConfigButton" class="btn btn-primary">
                    <span>&#x1F4BE;</span> Sauvegarder
                </button>
            </div>

            <!-- Detection settings -->
            <div class="config-card">
                <h3>Detection</h3>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="threshold">Precision</label>
                        <input type="range" id="threshold" min="0" max="1" step="0.1" value="{{ settings['global']['threshold'] }}">
                        <span id="threshold-value">{{ settings['global']['threshold'] }}</span>
                    </div>
                    <div class="setting-item">
                        <label for="delay">Delai entre detections</label>
                        <div class="setting-control">
                            <input type="number" id="delay" name="delay" min="0" step="0.1" value="{{ settings['global']['delay'] }}">
                            <span class="unit">sec</span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Demarrage automatique</label>
                        <div class="auto-start-toggle">
                            <label class="switch">
                                <input type="checkbox" id="auto-start"
                                       {% if settings.microphone.auto_start %}checked{% endif %}>
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sources -->
            <div class="config-card webhooks">
                <h3>Sources audio</h3>
                <div class="webhook-grid">

                    <!-- Microphone -->
                    <div class="webhook-card">
                        <div class="webhook-header">
                            <h4>&#x1F3A4; Microphone</h4>
                            <label class="switch" title="Activer/Desactiver">
                                <input type="checkbox" id="webhook-mic-enabled"
                                       {% if settings.microphone.enabled %}checked{% endif %}>
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="webhook-content" {% if not settings.microphone.enabled %}style="display: none;"{% endif %}>
                            <div class="webhook-input-group mb-3">
                                <label class="form-label">Webhook</label>
                                <div class="webhook-input-with-test">
                                    <input type="url" id="webhook-mic-url"
                                           value="{{ settings.microphone.webhook_url }}"
                                           placeholder="https://votre-serveur.com/webhook"
                                           aria-label="URL du webhook">
                                    <button type="button" class="test-webhook" data-source="mic">
                                        &#x1F514; Tester
                                    </button>
                                </div>
                            </div>
                            <div class="source-selector">
                                <label for="micro_source">Source :</label>
                                <select name="micro_source" id="micro_source">
                                    {% for device in devices %}
                                    <option value="{{ device.index }}|{{ device.name }}|{{ device.pulse_name|default('', true) }}"
                                            {% if device.name == settings.microphone.audio_source %}selected{% endif %}>
                                        {{ device.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mic-volume-section">
                                <div class="mic-volume-header">
                                    <label for="mic-volume">Volume : <span id="mic-volume-value">{{ settings.microphone.volume|default(100) }}%</span></label>
                                    <div class="auto-volume-toggle">
                                        <label class="switch" title="Volume automatique">
                                            <input type="checkbox" id="mic-auto-volume"
                                                   {% if settings.microphone.auto_volume %}checked{% endif %}>
                                            <span class="slider round"></span>
                                        </label>
                                        <span class="auto-volume-label">Auto</span>
                                    </div>
                                </div>
                                <input type="range" id="mic-volume" min="0" max="150" step="5"
                                       value="{{ settings.microphone.volume|default(100) }}" class="mic-volume-slider"
                                       {% if settings.microphone.auto_volume %}disabled{% endif %}>
                            </div>
                            <div class="mic-test-section">
                                <button type="button" id="mic-test-btn" class="btn-mic-test">
                                    &#x1F3A4; Tester le micro
                                </button>
                                <div id="mic-test-vu" class="vu-meter" style="display: none;">
                                    <div class="vu-meter-track">
                                        <div id="mic-test-bar" class="vu-meter-bar"></div>
                                    </div>
                                    <span id="mic-test-db" class="vu-meter-label">-60 dB</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- VBAN -->
                    <div class="webhook-card">
                        <div class="card-header">
                            <h4>&#x1F3B5; Sources VBAN</h4>
                            <button id="refreshVBANBtn" class="refresh-btn">
                                <img src="{{ url_for('static', filename='img/refresh.svg') }}" alt="Rafraichir">
                            </button>
                        </div>
                        <div class="webhook-content">
                            <div class="vban-section">
                                <h5>Detectees</h5>
                                <div id="detectedVBANSources" class="list-group mb-3">
                                    <div class="list-group-item text-muted">Aucune source VBAN detectee</div>
                                </div>
                            </div>
                            <div class="vban-section">
                                <h5>Configurees</h5>
                                <div id="savedVBANSources" class="list-group">
                                    <div class="list-group-item text-muted">Aucune source VBAN configuree</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RTSP -->
                    <div class="webhook-card">
                        <div class="card-header">
                            <h4>&#x1F4F9; Flux RTSP</h4>
                        </div>
                        <div class="webhook-content">
                            <div id="rtspStreamsContainer"></div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer>
        {% if debug %}
        <a href="#" onclick="runTests(); return false;">Tests</a> |
        {% endif %}
        <a href="https://korben.info">Korben</a> & <a href="https://lesfrerespoulain.fr/">Les Freres Poulain</a>
    </footer>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <script type="text/javascript">
        window.settings = {{ settings|tojson }};
        window.settings.debug = {{ 'true' if debug else 'false' }};
        window.basePath = '{{ ingress_path }}';
    </script>

    <script type="module" src="{{ url_for('static', filename='js/script.js') }}?v={{ cache_bust }}"></script>

    <!-- Fallback inline -->
    <script type="text/javascript">
    (function() {
        var testing = false;
        document.addEventListener('click', function(e) {
            var btn = e.target.closest && e.target.closest('#mic-test-btn');
            if (!btn) return;

            var basePath = window.basePath || '';
            if (testing) {
                fetch(basePath + '/api/mic/test/stop', {method: 'POST'});
                testing = false;
                btn.innerHTML = '&#x1F3A4; Tester le micro';
                btn.classList.remove('active');
                var vu = document.getElementById('mic-test-vu');
                if (vu) vu.style.display = 'none';
            } else {
                // Envoyer le device actuellement selectionne dans le dropdown
                var micSelect = document.getElementById('micro_source');
                var body = {};
                if (micSelect && micSelect.value) {
                    var parts = micSelect.value.split('|');
                    body = {pulse_name: parts[2] || '', audio_source: parts[1] || ''};
                }
                fetch(basePath + '/api/mic/test/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.success) {
                            testing = true;
                            btn.innerHTML = '&#x23F9; Arreter le test';
                            btn.classList.add('active');
                            var vu = document.getElementById('mic-test-vu');
                            if (vu) vu.style.display = 'flex';
                        }
                    })
                    .catch(function(err) { console.error('Mic test error:', err); });
            }
        });

        // Helper : lire le pulse_name du device selectionne
        function getSelectedPulseName() {
            var sel = document.getElementById('micro_source');
            if (sel && sel.value) {
                return sel.value.split('|')[2] || '';
            }
            return '';
        }

        // Volume slider
        var volSlider = document.getElementById('mic-volume');
        var volLabel = document.getElementById('mic-volume-value');
        if (volSlider) {
            volSlider.addEventListener('input', function() {
                volLabel.textContent = volSlider.value + '%';
            });
            var volTimeout;
            volSlider.addEventListener('change', function() {
                var volume = parseInt(volSlider.value);
                clearTimeout(volTimeout);
                volTimeout = setTimeout(function() {
                    var basePath = window.basePath || '';
                    fetch(basePath + '/api/microphone/volume', {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({volume: volume, pulse_name: getSelectedPulseName()})
                    }).then(function(r) { return r.json(); })
                      .then(function(data) {
                          if (data.success) console.log('Volume mis a jour:', volume + '%');
                      })
                      .catch(function(err) { console.error('Erreur volume:', err); });
                }, 300);
            });
        }

        // Auto-volume toggle
        var autoVolCheck = document.getElementById('mic-auto-volume');
        if (autoVolCheck) {
            autoVolCheck.addEventListener('change', function() {
                var enabled = autoVolCheck.checked;
                var basePath = window.basePath || '';
                fetch(basePath + '/api/microphone/auto-volume', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: enabled, pulse_name: getSelectedPulseName()})
                }).then(function(r) { return r.json(); })
                  .then(function(data) {
                      if (data.success) {
                          var slider = document.getElementById('mic-volume');
                          if (slider) slider.disabled = enabled;
                          console.log('Auto-volume:', enabled ? 'active' : 'desactive');
                      } else {
                          autoVolCheck.checked = !enabled;
                          console.error('Auto-volume erreur:', data.error);
                      }
                  })
                  .catch(function(err) {
                      autoVolCheck.checked = !enabled;
                      console.error('Auto-volume erreur:', err);
                  });
            });
        }

        // Auto-start toggle
        var autoStartCheck = document.getElementById('auto-start');
        if (autoStartCheck) {
            autoStartCheck.addEventListener('change', function() {
                var basePath = window.basePath || '';
                fetch(basePath + '/api/microphone/auto-start', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enabled: autoStartCheck.checked})
                });
            });
        }

        // Socket.io mic levels
        var checkSocket = setInterval(function() {
            if (typeof io !== 'undefined') {
                clearInterval(checkSocket);
                var basePath = window.basePath || '';
                var sock = io({path: basePath + '/socket.io'});
                sock.on('mic_level', function(data) {
                    var bar = document.getElementById('mic-test-bar');
                    var label = document.getElementById('mic-test-db');
                    if (!bar || !label || data.error) return;
                    var pct = Math.max(0, Math.min(100, ((data.db + 60) / 60) * 100));
                    bar.style.width = pct + '%';
                    label.textContent = data.db + ' dB';
                });
                // Auto-volume : mettre a jour le slider quand l'AGC ajuste
                sock.on('auto_volume_update', function(data) {
                    var slider = document.getElementById('mic-volume');
                    var label = document.getElementById('mic-volume-value');
                    if (slider && label && data.volume !== undefined) {
                        slider.value = data.volume;
                        label.textContent = data.volume + '%';
                    }
                });

                // RTSP test VU-metre
                sock.on('rtsp_level', function(data) {
                    // Trouver la barre et le label correspondants
                    var bars = document.querySelectorAll('.rtsp-test-bar');
                    var labels = document.querySelectorAll('.rtsp-test-db');
                    bars.forEach(function(bar) {
                        if (!data.error) {
                            var pct = Math.max(0, Math.min(100, ((data.db + 60) / 60) * 100));
                            bar.style.width = pct + '%';
                        }
                    });
                    labels.forEach(function(label) {
                        if (data.error) {
                            label.textContent = 'Erreur';
                        } else {
                            label.textContent = data.db + ' dB';
                        }
                    });
                });

                // Ecouter les changements d'etat de detection (auto-start, stop)
                sock.on('detection_status', function(data) {
                    var startBtn = document.getElementById('startButton');
                    var stopBtn = document.getElementById('stopButton');
                    if (!startBtn || !stopBtn) return;
                    if (data.status === 'running') {
                        startBtn.style.display = 'none';
                        stopBtn.style.display = 'block';
                    } else {
                        startBtn.style.display = 'block';
                        stopBtn.style.display = 'none';
                    }
                });
            }
        }, 200);

        // Verifier l'etat de detection au chargement
        (function() {
            var basePath = window.basePath || '';
            fetch(basePath + '/status')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.running) {
                        var startBtn = document.getElementById('startButton');
                        var stopBtn = document.getElementById('stopButton');
                        if (startBtn) startBtn.style.display = 'none';
                        if (stopBtn) stopBtn.style.display = 'block';
                    }
                })
                .catch(function() {});
        })();
    })();
    </script>

    <template id="vbanDetectedSourceTemplate">
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong class="source-name"></strong>
                <small class="text-muted d-block">IP: <span class="source-ip"></span> - Port: <span class="source-port"></span></small>
            </div>
            <button class="btn btn-sm btn-success add-vban-btn">Ajouter</button>
        </div>
    </template>

    <template id="vbanSavedSourceTemplate">
        <div class="list-group-item">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong class="source-name"></strong>
                    <small class="text-muted d-block">IP: <span class="source-ip"></span> - Port: <span class="source-port"></span></small>
                </div>
                <div class="source-controls">
                    <label class="switch" title="Activer/Desactiver">
                        <input type="checkbox" class="source-enabled">
                        <span class="slider round"></span>
                    </label>
                    <button type="button" class="btn btn-light btn-sm delete-vban-btn">
                        <span class="icon" style="color: var(--color-danger);">&#x274C;</span>
                    </button>
                </div>
            </div>
            <div class="webhook-input-group mt-2">
                <label class="form-label">Webhook</label>
                <div class="webhook-input-with-test">
                    <input type="url" class="webhook-input webhook-url"
                           placeholder="https://votre-serveur.com/webhook">
                    <button type="button" class="test-webhook">
                        &#x1F514; Tester
                    </button>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
