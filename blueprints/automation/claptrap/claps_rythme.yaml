blueprint:
  name: ClapTrap — Rythme de claps pour lancer des actions
  description: >-
    Lance les actions de votre choix quand ClapTrap entend un rythme précis :
    « 2+1 » (deux claps rapides, une pause, un clap), « 1+2 », « 1+1+1 »…
    Chaque nombre est un groupe de claps rapides, chaque « + » une pause.
    Le groupe de sons doit compter jusqu'au nombre total de claps (cochez
    par exemple « 3 claps » pour « 2+1 »), sinon le geste est coupé plus tôt.
  domain: automation
  author: ClapTrap
  source_url: https://github.com/powange/ClapTrap-HA-Addon/blob/main/blueprints/automation/claptrap/claps_rythme.yaml
  homeassistant:
    min_version: "2025.10.0"
  input:
    rythme:
      name: Rythme
      description: Groupes de claps rapides séparés par des pauses.
      default: "2+1"
      selector:
        select:
          custom_value: true
          options:
            - "2+1"
            - "1+2"
            - "1+1"
            - "1+1+1"
            - "2+2"
            - "3+1"
            - "1+3"
    groupe:
      name: Groupe de sons (facultatif)
      description: >-
        Nom du groupe tel qu'affiché dans ClapTrap (« Clap », « Doigts »…).
        Vide : tous les groupes.
      default: ""
      selector:
        text: {}
    source:
      name: Clé de la source (facultatif)
      description: >-
        La partie après « claptrap_ » dans les entités de la source : pour
        binary_sensor.claptrap_salon_clap_2_claps, la clé est « salon » (les
        réglages de la source montrent ses entités). Vide : toutes les
        sources.
      default: ""
      selector:
        text: {}
    actions:
      name: Actions
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  rythme: !input rythme
  groupe: !input groupe
  source: !input source

triggers:
  - trigger: event
    event_type: claptrap_clap

# Rythme saisi a la main : espaces ignores (« 2 + 1 » = « 2+1 »).
conditions:
  - condition: template
    value_template: >-
      {{ trigger.event.data.rhythm == (rythme | string | replace(' ', ''))
         and (groupe | trim == '' or trigger.event.data.group_name == groupe | trim)
         and (source | trim == '' or trigger.event.data.entity_key == source | trim | lower) }}

actions: !input actions
