configuration:
  mqtt_host:
    name: External MQTT broker
    description: >-
      Address of an MQTT broker other than the Mosquitto add-on (NAS, Docker…).
      Leave empty to use Mosquitto.
  mqtt_port:
    name: Broker port
    description: Port of the external broker (1883 by default, 8883 with TLS).
  mqtt_username:
    name: MQTT username
    description: Username for the external broker.
  mqtt_password:
    name: MQTT password
    description: Password for the external broker.
  mqtt_tls:
    name: TLS connection
    description: Encrypt the connection to the external broker.
  mqtt_tls_verify:
    name: Verify certificate
    description: >-
      Uncheck only for a self-signed certificate (encrypted connection, but
      the broker is not authenticated).
  mqtt_commands:
    name: MQTT commands
    description: >-
      Listen to the claptrap/command topic (adding, changing and deleting
      sources and groups). Uncheck to forbid it; the settings entities
      (threshold, enable, name) stay usable.
  vban_port:
    name: VBAN listening port
    description: >-
      UDP port on which ClapTrap receives VBAN streams (6980 by default).
      Change it if another service already listens on that port on Home
      Assistant (Wyoming VBAN for example), then set the sender to this port.
