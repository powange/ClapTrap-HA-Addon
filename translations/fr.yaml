configuration:
  mqtt_host:
    name: Broker MQTT externe
    description: >-
      Adresse d'un broker MQTT autre que l'add-on Mosquitto (NAS, Docker…).
      Laisser vide pour utiliser Mosquitto.
  mqtt_port:
    name: Port du broker
    description: Port du broker externe (1883 par défaut, 8883 avec TLS).
  mqtt_username:
    name: Utilisateur MQTT
    description: Nom d'utilisateur du broker externe.
  mqtt_password:
    name: Mot de passe MQTT
    description: Mot de passe du broker externe.
  mqtt_tls:
    name: Connexion TLS
    description: Chiffrer la connexion au broker externe.
  mqtt_tls_verify:
    name: Vérifier le certificat
    description: >-
      Décocher seulement pour un certificat auto-signé (connexion chiffrée,
      mais broker non authentifié).
  mqtt_commands:
    name: Commandes MQTT
    description: >-
      Écouter le topic claptrap/command (ajout, modification, suppression de
      sources et de groupes). Décocher pour l'interdire ; les entités de
      réglage (seuil, activation, nom) restent utilisables.
  vban_port:
    name: Port d'écoute VBAN
    description: >-
      Port UDP sur lequel ClapTrap reçoit les flux VBAN (6980 par défaut).
      À changer si un autre service écoute déjà ce port sur Home Assistant
      (Wyoming VBAN par exemple), puis régler l'émetteur sur ce port.
