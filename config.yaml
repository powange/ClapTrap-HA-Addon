name: "ClapTrap"
version: "6.46.0"
slug: "claptrap"
# Image publiee par .github/workflows/builder.yaml (multi-architecture) : le
# Supervisor la telecharge au lieu de la construire chez chaque utilisateur.
image: "ghcr.io/powange/claptrap"
description: "Application de détection d'applaudissements en temps réel utilisant YAMNet, compatible avec les flux audio locaux et RTSP"
url: "https://github.com/powange/ClapTrap-HA-Addon"
arch:
  - aarch64
  - amd64
startup: application
host_network: true
audio: true
hassio_api: true
hassio_role: default
homeassistant_api: true
services:
  - mqtt:need
ingress: true
ingress_port: 16045
init: false
homeassistant: "2025.10.0"
# Serveur bloque : relance par le Supervisor (option « Watchdog » de l'add-on).
watchdog: "tcp://[HOST]:[PORT:16045]"
# Arret propre (MQTT puis detection) avant l'arret force.
timeout: 15
panel_icon: "mdi:hand-clap"
maintainer: "powange"
