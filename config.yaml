name: "ClapTrap"
version: "6.83.0"
slug: "claptrap"
# Image publiee par .github/workflows/ci.yaml (multi-architecture) : le
# Supervisor la telecharge au lieu de la construire chez chaque utilisateur.
image: "ghcr.io/powange/claptrap"
description: "Application de détection d'applaudissements en temps réel utilisant YAMNet, compatible avec les flux audio locaux et RTSP"
url: "https://github.com/powange/ClapTrap-HA-Addon"
arch:
  - aarch64
  - amd64
startup: application
host_network: true
audio: true
hassio_api: true
hassio_role: default
homeassistant_api: true
# Broker de l'add-on Mosquitto s'il est installe ; sinon broker externe a
# renseigner dans les options ci-dessous (onglet Configuration).
services:
  - mqtt:want
# Valeurs affichees cochees dans l'onglet Configuration (absentes, elles
# s'affichaient decochees alors qu'actives).
options:
  mqtt_tls_verify: true
  mqtt_commands: true
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  mqtt_tls_verify: bool?
  mqtt_commands: bool?
ingress: true
ingress_port: 16045
init: false
homeassistant: "2025.10.0"
# Versions qui changent des entity_id : la mise a jour automatique s'arrete
# avant elles (mise a jour manuelle, apres lecture de « Mises a jour :
# changements a connaitre »). A completer a chaque changement de ce type.
breaking_versions:
  - "6.25.0"   # source_id d'une camera
  - "6.28.0"   # entity_id du micro
  - "6.32.0"   # source_id d'un flux VBAN
  - "6.33.0"   # entity_id en ASCII
  - "6.45.0"   # routes d'API retirees
# Serveur bloque : relance par le Supervisor (option « Watchdog » de l'add-on).
watchdog: "tcp://[HOST]:[PORT:16045]"
# Arret propre (MQTT puis detection) avant l'arret force.
timeout: 15
panel_icon: "mdi:hand-clap"
maintainer: "powange"
